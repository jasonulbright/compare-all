<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Colors are the constants of ca_ui::theme::icon:
    BACK_FILL #9AA6B8, BACK_EDGE #4A5566, FRONT_FILL #F2F4F8, FRONT_EDGE #2A3340,
    TEXT_LINE #5C687A, LENS_RIM #1F4E8C, LENS_TINT #3B82D6 at alpha 0x2E, HANDLE #2A3340.
    `cargo xtask icon` removes each block between the lines markers for the sizes
    below 32 pixels, where a line is thinner than one pixel.
  -->
  <defs>
    <g id="pages">
      <rect x="20" y="14" width="136" height="176" rx="10" fill="#9AA6B8" stroke="#4A5566" stroke-width="10"/>
      <!--lines:begin-->
      <g stroke="#5C687A" stroke-width="7" stroke-linecap="round">
        <path d="M40 40H136M40 60H120M40 80H136M40 100H112M40 120H136M40 140H124M40 160H104"/>
      </g>
      <!--lines:end-->
      <rect x="92" y="62" width="144" height="180" rx="10" fill="#F2F4F8" stroke="#2A3340" stroke-width="10"/>
      <!--lines:begin-->
      <g stroke="#5C687A" stroke-width="7" stroke-linecap="round">
        <path d="M112 90H216M112 110H196M112 130H216M112 150H184M112 170H216M112 190H204M112 210H168"/>
      </g>
      <!--lines:end-->
    </g>
    <clipPath id="lens">
      <circle cx="116" cy="118" r="54"/>
    </clipPath>
  </defs>
  <use xlink:href="#pages"/>
  <g clip-path="url(#lens)">
    <rect x="0" y="0" width="256" height="256" fill="#F2F4F8"/>
    <use xlink:href="#pages" transform="translate(116 118) scale(1.7) translate(-116 -118)"/>
    <circle cx="116" cy="118" r="54" fill="#3B82D6" fill-opacity="0.18"/>
  </g>
  <path d="M158 160L226 228" stroke="#2A3340" stroke-width="30" stroke-linecap="round"/>
  <circle cx="116" cy="118" r="54" fill="none" stroke="#1F4E8C" stroke-width="16"/>
</svg>
