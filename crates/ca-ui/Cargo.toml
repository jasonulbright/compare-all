[package]
name = "ca-ui"
description = "Shared interface layer: job system, view trait, commands, theme and widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ca_ui"
path = "src/lib.rs"

[dependencies]
ca-io.workspace = true
ca-diff.workspace = true
ca-fs.workspace = true
ca-grammar.workspace = true
ca-report.workspace = true
ca-session.workspace = true
ca-text.workspace = true
serde.workspace = true
serde_json.workspace = true
egui = { workspace = true, features = ["accesskit"] }
rfd.workspace = true
resvg.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
tempfile.workspace = true
regex.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[lints]
workspace = true
