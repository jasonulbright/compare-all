[package]
name = "ca-update"
description = "Update check, download, verification, staging and apply for compare-all"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ca-io.workspace = true
serde.workspace = true
serde_json.workspace = true
msi = "0.10"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
winsafe = { version = "0.0.24", features = ["kernel"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
