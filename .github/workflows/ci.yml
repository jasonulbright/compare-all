name: ci

# Public repositories check every branch push and pull request. Private
# repositories check version tags, manual runs and same-repository pull
# requests; private branch pushes and fork pull requests start no hosted job.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: check (${{ matrix.name }})
    if: >-
      (github.event.repository.name != '' && github.event.repository.private == false) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
          - name: linux
            runs-on: ubuntu-24.04
          - name: macos
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        run: |
          bash -n scripts/package-linux-appimage.sh
          bash -n scripts/deploy-linux-appimage.sh
          bash -n scripts/fetch-appimage-tools.sh
          bash -n scripts/verify-linux-appimage.sh
          sh -n assets/linux/AppRun.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The randomized merge drivers run a reduced case count here. The
      # merge-drivers job runs them at the full count.
      - run: cargo test --workspace
        env:
          MERGE_DRIVER_CASES: "60"

  # Runs the randomized merge drivers at their full case counts. Release
  # mode keeps the full counts within a short run. The whole workspace is
  # built so that dependency features match the other jobs; a build of the
  # merge crate alone links the system Wayland library, which this runner
  # does not have.
  merge-drivers:
    name: check (merge drivers)
    if: >-
      (github.event.repository.name != '' && github.event.repository.private == false) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      - run: >-
          cargo test --release --workspace --lib --
          tests::randomized_merge_driver tests::merge_edit_driver tests::frame_undo_probes
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

  # Fails on any RustSec vulnerability advisory in Cargo.lock. The advisory
  # database is fetched at run time, so a new advisory can fail a run with no
  # change in the repository.
  advisories:
    name: check (advisories)
    if: >-
      (github.event.repository.name != '' && github.event.repository.private == false) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit

  # Builds the AppImage as the release does and starts it on clean systems,
  # so a packaging fault shows before a release tag exists. The deployment
  # runs in the pinned archlinux container through the runner's Docker.
  appimage:
    name: check (appimage)
    if: >-
      (github.event.repository.name != '' && github.event.repository.private == false) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      - run: >-
          sudo apt-get update && sudo apt-get install -y desktop-file-utils zsync
      - name: Build release binaries
        run: cargo xtask build -p ca-app -p ca-cli --release
      - name: Build the AppImage
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-appimage-tools.sh "$RUNNER_TEMP/appimage-tools"
          version="$(target/release/ca --version | awk '{print $NF}')"
          bash scripts/package-linux-appimage.sh "$version" "$RUNNER_TEMP/appimage-tools"
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Test the AppImage on a clean system
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-linux-appimage.sh "dist/compare-all-$version-x86_64.AppImage" \
            "$RUNNER_TEMP/appimage-check"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-check
          path: ${{ runner.temp }}/appimage-check
          if-no-files-found: ignore
      - name: Test the AppImage with the catalog Firejail gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-appimage-catalog-gate.sh "dist/compare-all-$version-x86_64.AppImage" \
            "$RUNNER_TEMP/appimage-catalog-check"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-catalog-check
          path: ${{ runner.temp }}/appimage-catalog-check
          if-no-files-found: ignore
