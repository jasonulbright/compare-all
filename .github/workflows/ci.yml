name: ci

# Public repositories check every branch push and pull request. Private
# repositories check version tags, manual runs and same-repository pull
# requests; private branch pushes and fork pull requests start no hosted job.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: check (${{ matrix.name }})
    if: >-
      (github.event.repository.name != '' && github.event.repository.private == false) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
          - name: linux
            runs-on: ubuntu-latest
          - name: macos
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        run: bash -n scripts/package-linux-appimage.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
