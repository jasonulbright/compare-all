name: release

# A tag `vYYYY.MM.DD.NNNN` builds, signs, verifies, and publishes a release.
# The release notes are the `# <tag>` section of CHANGELOG.md, which must exist.
# Windows: signed executables, a signed MSI, and a portable zip. Linux x86_64
# and macOS aarch64: unsigned tarballs. Linux x86_64 also: an AppImage and its
# .zsync update file. Every file has a SHA-256 sum.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  SIGN_ENDPOINT: https://eus.codesigning.azure.net
  SIGN_ACCOUNT: signalridgelabs
  SIGN_PROFILE: SRL-Public
  SIGN_SUBJECT_CN: Jason Ulbright
  WIX_VERSION: 5.0.2
  COSIGN_VERSION: v3.1.3

jobs:
  windows:
    runs-on: windows-latest
    # The federated credential trusts this repository only through this
    # environment.
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
        with:
          components: clippy, rustfmt

      - name: Check the tag against the version the build embeds
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d{4}\.\d{2}\.\d{2}\.\d{4}$') {
            throw "Tag $tag does not have the form vYYYY.MM.DD.NNNN."
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^# $([regex]::Escape($tag))$" -Quiet)) {
            throw "CHANGELOG.md has no section for $tag."
          }
          $number = (Get-Content BUILD_NUMBER -Raw).Trim()
          if (-not $tag.EndsWith(".$number")) {
            throw "Tag $tag does not end with build number $number."
          }

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Install the WiX tool
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Build release binaries
        run: cargo xtask build -p ca-app -p ca-cli --release

      - name: Check the embedded version against the tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $embedded = ((& target\release\ca.exe --version) -split '\s+')[-1]
          if ("v$embedded" -ne $env:RELEASE_TAG) {
            throw "The binaries embed $embedded, the tag is $env:RELEASE_TAG."
          }

      # Login sits directly before the sign steps: the federated assertion is
      # short lived, and the signing token is cached for at most 60 minutes
      # from this step.
      - name: Azure login (federated, no secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.SIGN_ENDPOINT }}
          signing-account-name: ${{ env.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGN_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\compare-all.exe
            ${{ github.workspace }}\target\release\ca.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The MSI is built after the executables are signed, so it carries the
      # signed files. It is then signed in the same folder.
      - name: Build the MSI
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo xtask package
          if ($LASTEXITCODE -ne 0) { throw 'cargo xtask package failed' }
          $version = $env:RELEASE_TAG.Substring(1)
          Copy-Item "target/package/compare-all-$version-x64.msi" target/release/

      - name: Sign the MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.SIGN_ENDPOINT }}
          signing-account-name: ${{ env.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: msi
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          .\scripts\verify-signatures.ps1 -Path target\release\compare-all.exe, target\release\ca.exe, "target\release\compare-all-$version-x64.msi" -ExpectedSubjectCommonName $env:SIGN_SUBJECT_CN

      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $name = "compare-all-$version-windows-x64"
          $msi = "compare-all-$version-x64.msi"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/compare-all.exe, target/release/ca.exe, README.md, CHANGELOG.md, LICENSE, THIRD-PARTY-NOTICES.md "dist/$name"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item "target/release/$msi" dist/
          foreach ($file in @("$name.zip", $msi)) {
            (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLower() + "  $file" | Set-Content "dist/$file.sha256"
          }
          Remove-Item -Recurse "dist/$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-22.04
          - name: macos-aarch64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      # The AppImage bundles libxkbcommon-x11 and libxcb-xkb, which
      # libgtk-3-dev does not install. zsync puts zsyncmake on PATH, which
      # appimagetool looks for to write the .zsync update file.
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y desktop-file-utils libgtk-3-dev
          libxkbcommon-x11-0 libxcb-xkb1 zsync

      - name: Build release binaries
        run: cargo xtask build -p ca-app -p ca-cli --release

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]]; then
            echo "release tag must have the form vYYYY.MM.DD.NNNN" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          name="compare-all-$version-${{ matrix.name }}"
          embedded="$(target/release/ca --version | awk '{print $NF}')"
          if [[ "$embedded" != "$version" ]]; then
            echo "The binaries embed $embedded, the tag is $GITHUB_REF_NAME." >&2
            exit 1
          fi
          mkdir -p "dist/$name"
          cp target/release/compare-all target/release/ca README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md \
            assets/icon/compare-all-512.png "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - name: Build the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-appimage-tools.sh "$RUNNER_TEMP"
          version="${GITHUB_REF_NAME#v}"
          bash scripts/package-linux-appimage.sh "$version" \
            "$RUNNER_TEMP/appimagetool-x86_64.AppImage" "$RUNNER_TEMP/runtime-x86_64"

      # A failed check stops the job before anything is signed or uploaded, so
      # the publish job never sees an AppImage that cannot start.
      - name: Test the AppImage on a clean system
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash scripts/verify-linux-appimage.sh "dist/compare-all-$version-x86_64.AppImage" \
            "$RUNNER_TEMP/appimage-check"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign, verify, and checksum the Unix artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.AppImage dist/*.AppImage.zsync)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no Unix release artifacts were built" >&2
            exit 1
          fi
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          for artifact in "${files[@]}"; do
            bundle="$artifact.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$artifact"
            cosign verify-blob --bundle "$bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
            filename="${artifact#dist/}"
            if command -v sha256sum > /dev/null; then
              (cd dist && sha256sum "$filename" > "$filename.sha256")
            else
              (cd dist && shasum -a 256 "$filename" > "$filename.sha256")
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="# $GITHUB_REF_NAME" '$0 == tag { on = 1; next } /^# v/ { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
